name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [code-updated]

permissions:
  contents: write

# Only publish the newest requested build.
concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
  XCODEGEN_DIR: ${{ github.workspace }}/.cache/xcodegen/2.46.0
  DERIVED_DATA_PATH: ${{ github.workspace }}/code/build/DerivedData
  SOURCE_PACKAGES_PATH: ${{ github.workspace }}/code/build/SourcePackages

jobs:
  build-ipa:
    name: Build unsigned IPA and publish
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout distribution repo
        uses: actions/checkout@v4

      - name: Checkout app source (private repo)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/mini-music-player
          token: ${{ secrets.CODE_REPO_TOKEN || github.token }}
          path: code
          fetch-depth: 0

      - name: Inspect build environment
        id: build_env
        run: |
          set -euo pipefail
          xcodebuild -version
          echo "xcode_key=$(xcodebuild -version | shasum -a 256 | awk '{print substr($1, 1, 16)}')" >> "$GITHUB_OUTPUT"
          echo "Source commit: $(git -C code rev-parse HEAD)"

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          BASE=$(tr -d '[:space:]' < code/VERSION)
          if ! echo "$BASE" | grep -qE '^[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION file contents '$BASE' do not match expected format X.Y"
            exit 1
          fi
          BUILD=$(git -C code rev-list --count HEAD)
          COMMIT=$(git -C code rev-parse --short HEAD)
          SHORT="${BASE}.${BUILD}"
          PUBLISHED=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' apps.json | head -1)
          PUBLISHED="${PUBLISHED:-0.0.0}"
          NEWEST=$(printf '%s\n%s\n' "$PUBLISHED" "$SHORT" | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          if [ "$NEWEST" = "$PUBLISHED" ] && [ "$SHORT" != "$PUBLISHED" ]; then
            echo "::error::Computed version $SHORT is older than published version $PUBLISHED"
            exit 1
          elif [ "$SHORT" = "$PUBLISHED" ]; then
            echo "::warning::Computed version $SHORT equals published version $PUBLISHED; continuing"
          fi
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Restore XcodeGen cache
        id: xcodegen_cache
        uses: actions/cache@v4
        with:
          path: ${{ env.XCODEGEN_DIR }}
          key: xcodegen-${{ runner.os }}-${{ runner.arch }}-${{ env.XCODEGEN_VERSION }}

      - name: Install XcodeGen
        if: steps.xcodegen_cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/xcodegen.zip"
          rm -rf "$XCODEGEN_DIR"
          mkdir -p "$XCODEGEN_DIR"
          curl -fsSL --retry 3 \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            -o "$ZIP"
          echo "${XCODEGEN_SHA256}  ${ZIP}" | shasum -a 256 -c -
          unzip -q "$ZIP" -d "$XCODEGEN_DIR"

      - name: Generate Xcode project
        working-directory: code
        run: |
          set -euo pipefail
          chmod +x "$XCODEGEN_DIR/xcodegen/bin/xcodegen"
          "$XCODEGEN_DIR/xcodegen/bin/xcodegen" generate

      # Cache only dependency sources and compiler module caches. Build products
      # are intentionally excluded because the app embeds API credentials.
      - name: Restore Swift package and module caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.SOURCE_PACKAGES_PATH }}
            ${{ env.DERIVED_DATA_PATH }}/ModuleCache.noindex
            ${{ env.DERIVED_DATA_PATH }}/SDKStatCaches.noindex
            ~/Library/Caches/org.swift.swiftpm
          key: ios-deps-${{ runner.os }}-${{ runner.arch }}-${{ steps.build_env.outputs.xcode_key }}-${{ hashFiles('code/project.yml') }}
          restore-keys: |
            ios-deps-${{ runner.os }}-${{ runner.arch }}-${{ steps.build_env.outputs.xcode_key }}-

      - name: Build unsigned device app
        working-directory: code
        env:
          APP_VERSION: ${{ steps.version.outputs.short }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          MUSICKIT_DEVELOPER_TOKEN: ${{ secrets.MUSICKIT_DEVELOPER_TOKEN }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project MiniMusicPlayer.xcodeproj \
            -scheme MiniMusicPlayer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_PATH" \
            -skipPackageUpdates \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION="$APP_VERSION" \
            LASTFM_API_KEY="$LASTFM_API_KEY" \
            LASTFM_API_SECRET="$LASTFM_API_SECRET" \
            SPOTIFY_CLIENT_ID="$SPOTIFY_CLIENT_ID" \
            SPOTIFY_CLIENT_SECRET="$SPOTIFY_CLIENT_SECRET" \
            MUSICKIT_DEVELOPER_TOKEN="$MUSICKIT_DEVELOPER_TOKEN" \
            build

      - name: Verify and package unsigned IPA
        working-directory: code
        run: |
          set -euo pipefail
          APP_PATH="$DERIVED_DATA_PATH/Build/Products/Release-iphoneos/MiniMusicPlayer.app"
          PLIST="$APP_PATH/Info.plist"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::built .app not found at $APP_PATH"
            exit 1
          fi

          KEY=$(/usr/libexec/PlistBuddy -c 'Print :LastFMAPIKey' "$PLIST" 2>/dev/null || echo "")
          SECRET=$(/usr/libexec/PlistBuddy -c 'Print :LastFMAPISecret' "$PLIST" 2>/dev/null || echo "")
          if [ -z "$KEY" ] || [ -z "$SECRET" ] || case "$KEY" in '$('*) true;; *) false;; esac; then
            echo "::warning::Last.fm API credentials are not embedded (set LASTFM_API_KEY / LASTFM_API_SECRET secrets)."
          else
            echo "Last.fm API credentials embedded (key length: ${#KEY})."
          fi

          SPOTIFY_ID=$(/usr/libexec/PlistBuddy -c 'Print :SpotifyClientID' "$PLIST" 2>/dev/null || echo "")
          SPOTIFY_SECRET=$(/usr/libexec/PlistBuddy -c 'Print :SpotifyClientSecret' "$PLIST" 2>/dev/null || echo "")
          if [ -z "$SPOTIFY_ID" ] || [ -z "$SPOTIFY_SECRET" ] || case "$SPOTIFY_ID" in '$('*) true;; *) false;; esac; then
            echo "::warning::Spotify credentials are not embedded (set SPOTIFY_CLIENT_ID / SPOTIFY_CLIENT_SECRET secrets). Artist images will fall back to Apple Music only."
          else
            echo "Spotify credentials embedded (client id length: ${#SPOTIFY_ID})."
          fi

          MUSICKIT_TOKEN=$(/usr/libexec/PlistBuddy -c 'Print :MusicKitDeveloperToken' "$PLIST" 2>/dev/null || echo "")
          if [ -z "$MUSICKIT_TOKEN" ] || case "$MUSICKIT_TOKEN" in '$('*) true;; *) false;; esac; then
            echo "::error::MusicKit developer token is not embedded (set MUSICKIT_DEVELOPER_TOKEN secret)."
            exit 1
          elif [ "$(awk -F. '{print NF}' <<<"$MUSICKIT_TOKEN")" -ne 3 ]; then
            echo "::error::Embedded MusicKit developer token is not a three-part JWT."
            exit 1
          else
            echo "MusicKit developer token embedded (length: ${#MUSICKIT_TOKEN})."
          fi
          unset MUSICKIT_TOKEN

          SHORT=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")
          echo "Embedded version: $SHORT (build $BUILD)"
          if [ "$SHORT" != "${{ steps.version.outputs.short }}" ]; then
            echo "::error::CFBundleShortVersionString ($SHORT) does not match published version ${{ steps.version.outputs.short }}"
            exit 1
          fi

          rm -rf build/Payload build/MiniMusicPlayer.ipa
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          (cd build && zip -qry MiniMusicPlayer.ipa Payload)
          ls -lh build/MiniMusicPlayer.ipa

      - name: Publish IPA to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          if ! gh release view latest -R "$REPO" >/dev/null 2>&1; then
            gh release create latest -R "$REPO" --title "Latest build" --notes "Automated build" --latest
          fi
          n=0
          until [ "$n" -ge 5 ]; do
            if gh release upload latest code/build/MiniMusicPlayer.ipa -R "$REPO" --clobber; then
              echo "IPA uploaded"
              break
            fi
            n=$((n+1))
            echo "Upload failed (attempt $n/5). Retrying in 10s..."
            sleep 10
          done
          if [ "$n" -ge 5 ]; then
            echo "::error::Failed to upload IPA to release after 5 attempts"
            exit 1
          fi

      - name: Update AltStore source (apps.json)
        run: |
          set -euo pipefail
          IPA="code/build/MiniMusicPlayer.ipa"
          SIZE=$(stat -f%z "$IPA")
          VERSION="${{ steps.version.outputs.short }}"
          COMMIT_SHA="${{ steps.version.outputs.commit }}"
          DATE=$(date -u +%Y-%m-%d)
          DOWNLOAD_URL="https://github.com/nmt3325/mini-music-player-dist/releases/latest/download/MiniMusicPlayer.ipa"
          ICON_URL="https://nmt3325.github.io/mini-music-player-dist/assets/app-icon.png"
          cat > apps.json <<EOF
          {
            "name": "Mini Music Player",
            "identifier": "com.example.minimusicplayer.source",
            "apps": [
              {
                "name": "Mini Music Player",
                "bundleIdentifier": "com.example.MiniMusicPlayer",
                "developerName": "nmt3325",
                "version": "${VERSION}",
                "versionDate": "${DATE}",
                "versionDescription": "Automated build from CI (commit ${COMMIT_SHA}).",
                "downloadURL": "${DOWNLOAD_URL}",
                "localizedDescription": "iOS 6 / iOS 9 style music player.",
                "iconURL": "${ICON_URL}",
                "tintColor": "1DB954",
                "size": ${SIZE},
                "minOSVersion": "12.0"
              }
            ]
          }
          EOF
          cat apps.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps.json
          git commit -m "Update AltStore source (${VERSION})" || echo "no changes"
          git push
